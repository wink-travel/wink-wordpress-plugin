name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # The plugin supports PHP 8.0+, but PHPUnit 11 needs PHP 8.2+. So the full test suite runs on
  # 8.2-8.5, and PHP 8.0 and 8.1 are covered by the syntax check below plus the static
  # compatibility check (composer compat, testVersion 8.0-).
  lint:
    name: Syntax check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.0", "8.1" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint plugin files
        run: find wink.php includes -name '*.php' -print0 | xargs -0 -n1 php -l

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.3", "8.4", "8.5" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check PHP 8.0-8.5 compatibility
        run: composer compat

      - name: Run static analysis
        run: composer analyse

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --colors=never
