# git-cliff configuration. Used by release.bash to work out the next version and to write the
# CHANGELOG.md entry from the conventional commits since the latest release tag.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
# Releases are bare-semver tags (1.5.3). The older v-prefixed tags (v1.5.2) are history and still
# count as releases when the changelog looks for the previous one; anything else is ignored.
tag_pattern = "^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  # Release bookkeeping written by release.bash and the retired git flow.
  { message = "\\[no ci\\]", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^(build|ci|chore|style)", group = "Other changes" },
  { message = "^revert", group = "Reverts" },
]

[bump]
# feat bumps the minor version, anything else the patch version; a breaking change bumps the major
# version.
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "1.0.0"
